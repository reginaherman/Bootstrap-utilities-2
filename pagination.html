<!DOCTYPE html>
<html lang="en">
<head>
      <link rel="stylesheet"href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" >

<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagination</title>
</head>
<body>
    <div class="container-fluid">
        <h3>Pagination in Bootstrap</h3>
        <p>This is used to link pages</p>
        <ul class="pagination">
            <li class="page-item">
                <a class="page-link" href="https://www.youtube.com/">Previous</a>
            </li>
            <li class="page-item">
                <a class="page-link" href="https://www.codingal.com/">1</a>
            </li>
            <li class="page-item">
                <a class="page-link" href="https://www.google.com/">2</a>
            </li>
            <li class="page-item">
                <a class="page-link" href="#">Next</a>
            </li>
        </ul>
    </div>
    
</body>
</html>
